version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconops_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RAZORPAY_WEBHOOK_SECRET=whsec_demo_razorpay_fintech_2026
      - BYPASS_SIGNATURE_VERIFY=True
    volumes:
      - ./finance_controller.db:/app/finance_controller.db
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconops_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend

volumes:
  reconops_data:
